$kind: http-request
name: GET /clientes — Read (listar todos)
description: Lista todos os clientes cadastrados, ordenados por data de criação decrescente.
url: "{{baseUrl}}/clientes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Retorna array', () => {
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 2000
