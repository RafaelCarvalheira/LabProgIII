$kind: http-request
name: PATCH /financeiro/:id/pagar — Registrar pagamento
description: Marca um lançamento como pago, preenchendo data_pagamento=hoje e status='pago'.
url: "{{baseUrl}}/financeiro/{{financeiroId}}/pagar"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Status pago', () => {
        pm.expect(pm.response.json().status).to.eql('pago');
      });
    language: text/javascript
order: 3000
