services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: rcp_data_imob
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "8039:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rcp_data_imob"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8031:3000"
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rcp_data_imob
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8031
    ports:
      - "8032:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8031
    restart: unless-stopped

volumes:
  pgdata: